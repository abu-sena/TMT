<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf8f0" />
  <meta name="description" content="Petualangan Ilmu & Akhlak untuk anak Indonesia" />
  <title>TMT</title>
  <link rel="icon" type="image/png" href="/assets/field-guide/tmt-mark.png" />
  <style>
    @font-face { font-family: Nunito; font-weight: 400 900; font-display: swap; src: url("/assets/fonts/nunito-latin.woff2") format("woff2"); }
    html, body { margin: 0; min-height: 100%; background: #fcf7e9; }
    .tmt-native-splash { position: relative; isolation: isolate; min-height: 100dvh; display: grid; place-items: center; text-align: center; color: #173c3a; font: 800 1rem Nunito, system-ui, sans-serif; }
    .tmt-native-splash::before { content: ""; position: absolute; inset: 55% 0 0; z-index: -1; background: linear-gradient(#fcf7e9, transparent 24%), url("/assets/field-guide/kota-ilmu.webp") center 70% / cover; }
    .tmt-native-splash > div { margin-bottom: 15vh; padding: 1.25rem; }
    .tmt-native-splash p { margin-block: .5rem 0; }
    .splash-mark { display: block; width: clamp(10rem, 55vw, 15rem); height: auto; margin-inline: auto; }
    .splash-dots { display: flex; justify-content: center; gap: .42rem; margin-top: 2rem; }
    .splash-dots span { width: .45rem; height: .45rem; border-radius: 50%; background: #6fac9a; }
    .splash-dots span:nth-child(2) { background: #d9b76d; }
    .splash-dots span:nth-child(3) { background: #9fcfc3; }
  </style>
  <script type="module" src="/src/capacitor-main.tsx"></script>
</head>
<body>
  <div id="root">
    <div class="tmt-native-splash">
      <div>
        <img class="splash-mark" src="/assets/field-guide/tmt-mark.png" alt="TMT — The Mastermind Trials" width="720" height="720" />
        <p>Petualangan sang Mastermind</p>
        <div class="splash-dots" role="status" aria-label="Memuat petualangan"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
